name: validate

on:
  # push is restricted to main: for a same-repo PR branch, an unrestricted push trigger fires
  # alongside pull_request for the identical commit (different refs — refs/heads/<branch> vs
  # refs/pull/N/merge — so the concurrency group below does not dedupe them), doubling every
  # structural-lint run. Restricting push to main keeps exactly one run per PR head commit
  # (via pull_request) plus one run per push to main (via push) — the standard pattern.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Windows record-collection eval is path-gated below (it costs about twelve minutes on a
  # Windows runner against about one on Ubuntu). A weekly full run keeps it exercised on an
  # unchanged tree, so a platform-side regression cannot hide behind the gate.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A newer push to the same ref supersedes the running validation — cancel it instead of paying
# for a structural lint + eval pass for a commit that can no longer merge/land.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ubuntu checks run as parallel shards balanced by measured step time; the required
  # structural-lint job below passes only when every shard succeeded. Every shard repeats the
  # same pinned setup: SHAs per the suite's own supply-chain-trust skill, so a moved tag cannot
  # inject code into CI; the trailing comment tracks the version. fetch-depth: 0 (full history)
  # lets the PR-only plugin-bump check diff against origin/<base_ref>.
  # Shard 1: the record-collection eval (about 70 s) and the PR-only publishing gates.
  structural-lint-shard-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ""
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Documentation manifest freshness
        run: node scripts/docs-manifest.mjs check

      - name: Documentation extraction regression eval
        run: node evals/docs-manifest/run.mjs

      - name: Durable record-collection regression eval
        run: |
          node evals/record-collections/run.mjs
          node -e "const m=require('./code-ops-docs/98 System/DOCS_MANIFEST.json'); for (const c of m.recordCollections || []) require('node:child_process').execFileSync(process.execPath,['scripts/records.mjs','check','--collection',c.id],{stdio:'inherit'});"

      - name: Plugin version-bump gate (PR only)
        if: github.event_name == 'pull_request'
        run: node scripts/check-plugin-bump.mjs --base "origin/${{ github.base_ref }}"

      # The fail-closed backstop behind the enforce-traceless tool hook. The range is exactly
      # the PR's commits (base tip to PR head, not the synthetic merge commit), and the
      # title and body travel through env, never interpolated into the script.
      - name: Traceless publishing (PR commits, title, body)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pr_text="$RUNNER_TEMP/pr-title-body.md"
          node -e 'require("node:fs").writeFileSync(process.argv[1], `${process.env.PR_TITLE}\n\n${process.env.PR_BODY}\n`)' "$pr_text"
          node scripts/scan-ai-tells.mjs --git "$BASE_SHA..$HEAD_SHA" "$pr_text"

  # Shard 2: the slow orchestration and runtime evals (about 70 s).
  structural-lint-shard-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ""
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Attack-chain graph regression eval
        run: node evals/attack-chain-graph/run.mjs

      - name: Long-horizon runtime regression eval
        run: node evals/run-runtime/run.mjs

      - name: Local review and judgment orchestration evals
        run: |
          node evals/local-review-gate/run.mjs
          node evals/judgment-orchestration/run.mjs

      - name: Context snapshot and bundle regression evals
        run: |
          node evals/context-snapshot/run.mjs
          node evals/context-bundle/run.mjs
          node evals/worker-brief/run.mjs

      - name: Ladder card hook eval (opt-in switch + implementer filter)
        run: node evals/ladder-card/run.mjs

      - name: Dispatch guard hook eval (round budget + dispatch advisories)
        run: node evals/dispatch-guard/run.mjs

      - name: Atlas-check regression eval
        run: node evals/atlas-check/run.mjs

  # Shard 3: the structural gates and the remaining evals (about 60 s).
  structural-lint-shard-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ""
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: GitHub Action pin policy
        run: node scripts/check-action-pins.mjs

      - name: GitHub Action pin regression eval
        run: node evals/action-pins/run.mjs

      - name: Structural lint (the gate)
        run: node scripts/lint-plugins.mjs

      - name: Codex marketplace render + drift check
        run: node scripts/build-codex-marketplace.mjs --check

      - name: opencode distribution render + drift check
        run: node scripts/build-opencode-dist.mjs --check

      # Shape only — no --fetch. The pinned-id resolution check is opt-in and stays out of
      # CI so a models.dev outage can never fail this repository's build.
      - name: Model-tier registry shape check
        run: node scripts/check-model-registry.mjs

      - name: Zero-dependency guard
        run: node scripts/check-no-deps.mjs

      # The compiler is fetched at an exact pin into a temp dir, never into the repo, so the
      # zero-dependency guard still holds. Only files that opt in with // @ts-check are checked.
      - name: Type-check opted-in scripts (TypeScript 7)
        run: |
          tsdir="$RUNNER_TEMP/ts7"
          npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$tsdir" typescript@7.0.2 @types/node@24.13.6
          "$tsdir/node_modules/.bin/tsc" -p tsconfig.json --typeRoots "$tsdir/node_modules/@types"

      - name: Vault conformance (this repo's own vault)
        run: node scripts/check-vault-standard.mjs code-ops-docs

      - name: Vault-standard regression eval
        run: node evals/vault-standard/run.mjs

      - name: Fleet-standard regression eval
        run: node evals/fleet-standard/run.mjs

      - name: Register-staleness regression eval
        run: node evals/register-staleness/run.mjs

      - name: AI-trace scanner eval
        run: node evals/ai-tells/run.mjs

      - name: lib-docs engine eval
        run: node evals/lib-docs/run.mjs

      - name: MCP server smoke test
        run: node evals/lib-docs/mcp-smoke.mjs

      - name: Codex marketplace regression eval
        run: node evals/codex-marketplace/run.mjs

      - name: opencode distribution regression eval
        run: node evals/opencode-dist/run.mjs

      - name: opencode lifecycle regression eval
        run: node evals/opencode-lifecycle/run.mjs

      # No renderer for Grok Build: it reads the Claude plugin format natively, so the
      # canonical packages ARE its packages. This guards that contract from drifting.
      - name: Grok Build compatibility eval
        run: node evals/grok-build-compat/run.mjs

      - name: Researcher egress-manifest eval
        run: node evals/research-manifest/run.mjs

      - name: Script-guard regression eval (2026-06-23 audit fixes)
        run: node evals/script-guards/run.mjs

      - name: Global sync regression eval
        run: node evals/sync-global/run.mjs

      - name: Proof-receipt + proof-integrity eval
        run: node evals/proof-receipts/run.mjs

      - name: Autofix scope-gate eval
        run: node evals/autofix-scope/run.mjs

      - name: Redaction + injection-tell scanner eval
        run: node evals/redaction-scan/run.mjs

      - name: Handoff structural-checker eval
        run: node evals/handoff-check/run.mjs

      - name: Handoff draft and resume eval
        run: node evals/handoff-state/run.mjs

      - name: Fixture-drift guard (answer keys still match their fixtures)
        run: |
          for k in evals/*/ANSWER_KEY.json; do
            echo "== $k =="
            node evals/score.mjs "$k" --check
          done

      - name: Preflight regression eval
        run: node evals/preflight/run.mjs

      - name: Repo-map regression eval
        run: node evals/repo-map/run.mjs

      - name: Doc line-citation gate
        run: node scripts/check-doc-citations.mjs

      - name: Documentation link gate
        run: node scripts/check-doc-links.mjs

      - name: Documentation link regression eval
        run: node evals/doc-links/run.mjs

      - name: Lint-gate fixture eval
        run: node evals/lint-plugins/run.mjs

      - name: Release-tooling eval
        run: node evals/release-tooling/run.mjs

      - name: Doc-citation checker eval
        run: node evals/doc-citations/run.mjs

      - name: Import-graph regression eval
        run: node evals/import-graph/run.mjs

      - name: Dispatch-ledger regression eval
        run: node evals/dispatch-ledger/run.mjs

      - name: Run-contract regression eval
        run: node evals/run-contract/run.mjs

      - name: Pre-run cost estimator eval
        run: node evals/estimate-run-cost/run.mjs

      - name: Run-artifact narration scanner eval
        run: node evals/scan-narration/run.mjs

      - name: Context audit eval (transcript parser + SessionEnd receipt hook)
        run: node evals/context-audit/run.mjs

      - name: Script facade eval (co.mjs verb table + cli-lib)
        run: node evals/co-facade/run.mjs

      - name: File skim regression eval (outline and range reading)
        run: node evals/skim/run.mjs

      - name: Output-digest eval (shape detectors + must-keep contract)
        run: node evals/digest/run.mjs

      - name: Digest rewrite hook eval (opt-in switch + simple-command contract)
        run: node evals/digest-hook/run.mjs

      - name: Over-build scanner eval (decoy garden + mutation control)
        run: node evals/overbuild-garden/run.mjs

      - name: Deferral harvest eval (register shape + stable ids)
        run: node evals/deferral-harvest/run.mjs

      - name: Handoff card hook eval (opt-in switch + context-band threshold)
        run: node evals/handoff-card/run.mjs

      - name: Context query eval (symbol index, call edges, stale banner, refresh hook, providers)
        run: node evals/context-query/run.mjs

      - name: Context query MCP eval (stdio server, two tools, JSON-RPC errors)
        run: node evals/context-query-mcp/run.mjs

      - name: Calibration-metrics regression eval
        run: node evals/calibration-metrics/run.mjs

      - name: Calibration-graph regression eval
        run: node evals/calibration-graph/run.mjs

      - name: Atlas freshness (this repo's own Atlas)
        run: node scripts/atlas-check.mjs check --atlas "code-ops-docs/98 System/Atlas" --gate

      - name: Performance measurement regression eval
        run: node evals/benchmark-command/run.mjs

      # The eval above runs against fixtures; these two run against the REAL store, so a
      # hand-edited CALIBRATION_TABLE.md or a lesson whose enforcing eval was deleted fails CI.
      - name: Calibration-graph store validate + derived-table drift check
        run: |
          node scripts/calibration-graph.mjs validate
          node scripts/calibration-graph.mjs render --check

      - name: claude plugin validate (best-effort)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . || true
            for p in plugins/*/; do
              echo "validating $p"
              claude plugin validate "$p" || true
            done
          else
            echo "claude CLI not on runner; structural-lint is the gate."
          fi

  # The one required status context. It fails unless every shard it needs reports success, so a
  # failed, skipped, or cancelled shard fails it, and it covers every step the unsharded job ran.
  structural-lint:
    if: always()
    needs: [structural-lint-shard-1, structural-lint-shard-2, structural-lint-shard-3]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const ids = Object.keys(needs);
            for (const id of ids) console.log(`${id}: ${needs[id].result}`);
            const bad = ids.filter((id) => needs[id].result !== "success");
            if (ids.length === 0 || bad.length) { console.error(`shards not successful: ${bad.join(", ") || "none reported"}`); process.exit(1); }
          '


  # The two devices in use are Windows and macOS. Ubuntu and Windows run on every change; macOS
  # costs ten Linux minutes per minute, so it runs the host-facing evals on the weekly schedule
  # and on demand only, never per pull request.
  host-evals-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - run: node scripts/lint-plugins.mjs
      - run: node evals/skim/run.mjs
      - run: node evals/digest/run.mjs
      - run: node evals/digest-hook/run.mjs
      - run: node evals/context-query/run.mjs
      - run: node evals/context-query-mcp/run.mjs
      - run: node evals/ladder-card/run.mjs
      - run: node evals/handoff-card/run.mjs
      - run: node evals/dispatch-guard/run.mjs
      - run: node evals/context-audit/run.mjs
      - run: node evals/overbuild-garden/run.mjs
      - run: node evals/deferral-harvest/run.mjs
      - run: node evals/atlas-check/run.mjs

  # The Windows shards mirror the ubuntu checks so a platform-specific regression (path handling,
  # shell quoting, line endings) is caught before merge instead of surfacing only for a Windows
  # contributor. They use the same pinned setup as the ubuntu shards and are balanced by measured
  # Windows step time.
  # Shard 1: attack-chain, snapshot, and extraction evals (about 105 s).
  structural-lint-windows-shard-1:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ""
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Attack-chain graph regression eval
        run: node evals/attack-chain-graph/run.mjs

      - name: Context snapshot and bundle regression evals
        run: |
          node evals/context-snapshot/run.mjs
          node evals/context-bundle/run.mjs

      - name: Documentation extraction regression eval
        run: node evals/docs-manifest/run.mjs

  # Shard 2: runtime and review orchestration evals (about 100 s).
  structural-lint-windows-shard-2:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ""
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Long-horizon runtime regression eval
        run: node evals/run-runtime/run.mjs

      - name: Local review and judgment orchestration evals
        run: |
          node evals/local-review-gate/run.mjs
          node evals/judgment-orchestration/run.mjs

  # Shard 3: atlas, lint-gate, and dispatch-guard evals (about 105 s) plus the path-gated record eval.
  structural-lint-windows-shard-3:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ""
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Dispatch guard hook eval (round budget + dispatch advisories)
        run: node evals/dispatch-guard/run.mjs

      - name: Lint-gate fixture eval
        run: node evals/lint-plugins/run.mjs

      - name: Doc-citation checker eval
        run: node evals/doc-citations/run.mjs

      # The record eval dominates this leg (about 754 s of a 960 s job on the measured runs, against
      # 73 s on Ubuntu). It exercises scripts/records.mjs, scripts/record-lib.mjs, and their eval,
      # so it runs here only when the range under test touched those inputs, the generated record
      # authority, or this workflow. The documentation manifest is deliberately not on the list: it
      # re-syncs on nearly every change, and a manifest-only edit cannot alter record behavior
      # that the Ubuntu copy of the same eval would miss. Ubuntu still runs it on every change, and
      # the weekly schedule and manual dispatch run it here unconditionally.
      - name: Detect record-collection inputs
        id: records
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -e
          decide() { echo "changed=$1" >> "$GITHUB_OUTPUT"; echo "record-collection inputs changed: $1"; }
          case "$EVENT" in
            pull_request) git fetch -q origin "$BASE_REF"; range="origin/$BASE_REF...HEAD" ;;
            push) case "$BEFORE" in ''|0000000000000000000000000000000000000000) decide true; exit 0 ;; esac; range="$BEFORE..$HEAD_SHA" ;;
            schedule) decide true; exit 0 ;;
            *) decide false; exit 0 ;;
          esac
          files=$(git diff --name-only "$range" -- scripts/records.mjs scripts/record-lib.mjs scripts/docs-manifest.mjs evals/record-collections "code-ops-docs/98 System/Records" 2>/dev/null) || { decide true; exit 0; }
          # The workflow counts only when the changed lines are the record eval's own invocation
          # lines, so adding an unrelated eval step does not pay for the Windows run.
          invocation=$(git diff -U0 "$range" -- .github/workflows/validate.yml 2>/dev/null | grep -E "^[+-][^+-].*(node evals/record-collections/run\.mjs|'scripts/records\.mjs')" || true)
          if [ -n "$files" ] || [ -n "$invocation" ]; then decide true; else decide false; fi

      - name: Durable record-collection regression eval
        if: steps.records.outputs.changed == 'true'
        run: |
          node evals/record-collections/run.mjs
          node -e "const m=require('./code-ops-docs/98 System/DOCS_MANIFEST.json'); for (const c of m.recordCollections || []) require('node:child_process').execFileSync(process.execPath,['scripts/records.mjs','check','--collection',c.id],{stdio:'inherit'});"

      - name: Atlas-check regression eval
        run: node evals/atlas-check/run.mjs

  # Shard 4: the structural gates and the remaining evals (about 105 s).
  structural-lint-windows-shard-4:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ""
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: GitHub Action pin policy
        run: node scripts/check-action-pins.mjs

      - name: GitHub Action pin regression eval
        run: node evals/action-pins/run.mjs

      - name: Structural lint (the gate)
        run: node scripts/lint-plugins.mjs

      - name: Zero-dependency guard
        run: node scripts/check-no-deps.mjs

      - name: Codex marketplace render + drift check
        run: node scripts/build-codex-marketplace.mjs --check

      - name: opencode distribution render + drift check
        run: node scripts/build-opencode-dist.mjs --check

      # Shape only — no --fetch. The pinned-id resolution check is opt-in and stays out of
      # CI so a models.dev outage can never fail this repository's build.
      - name: Model-tier registry shape check
        run: node scripts/check-model-registry.mjs

      - name: Vault conformance (this repo's own vault)
        run: node scripts/check-vault-standard.mjs code-ops-docs

      - name: Context audit eval (transcript parser + SessionEnd receipt hook)
        run: node evals/context-audit/run.mjs

      - name: Script facade eval (co.mjs verb table + cli-lib)
        run: node evals/co-facade/run.mjs

      - name: File skim regression eval (outline and range reading)
        run: node evals/skim/run.mjs

      - name: Output-digest eval (shape detectors + must-keep contract)
        run: node evals/digest/run.mjs

      - name: Digest rewrite hook eval (opt-in switch + simple-command contract)
        run: node evals/digest-hook/run.mjs

      - name: Over-build scanner eval (decoy garden + mutation control)
        run: node evals/overbuild-garden/run.mjs

      - name: Deferral harvest eval (register shape + stable ids)
        run: node evals/deferral-harvest/run.mjs

      - name: Ladder card hook eval (opt-in switch + implementer filter)
        run: node evals/ladder-card/run.mjs

      - name: Handoff card hook eval (opt-in switch + context-band threshold)
        run: node evals/handoff-card/run.mjs

      - name: Context query eval (symbol index, call edges, stale banner, refresh hook, providers)
        run: node evals/context-query/run.mjs

      - name: Context query MCP eval (stdio server, two tools, JSON-RPC errors)
        run: node evals/context-query-mcp/run.mjs

      - name: Documentation manifest freshness
        run: node scripts/docs-manifest.mjs check

      - name: Vault-standard regression eval
        run: node evals/vault-standard/run.mjs

      - name: Fleet-standard regression eval
        run: node evals/fleet-standard/run.mjs

      - name: opencode distribution regression eval
        run: node evals/opencode-dist/run.mjs

      - name: opencode lifecycle regression eval
        run: node evals/opencode-lifecycle/run.mjs

      - name: Preflight regression eval
        run: node evals/preflight/run.mjs

      - name: Repo-map regression eval
        run: node evals/repo-map/run.mjs

      - name: Release-tooling eval
        run: node evals/release-tooling/run.mjs

      - name: Documentation link gate and regression eval
        run: |
          node scripts/check-doc-links.mjs
          node evals/doc-links/run.mjs

      - name: Script-guard regression eval (2026-06-23 audit fixes)
        run: node evals/script-guards/run.mjs

      - name: Global sync regression eval
        run: node evals/sync-global/run.mjs

      # The win32-only .cmd-shim checks in this eval execute ONLY here — the ubuntu run
      # of the same eval no-ops that section.
      - name: Proof-receipts regression eval
        run: node evals/proof-receipts/run.mjs

      - name: Register-staleness regression eval
        run: node evals/register-staleness/run.mjs

      - name: Import-graph regression eval
        run: node evals/import-graph/run.mjs

      - name: Run-contract regression eval
        run: node evals/run-contract/run.mjs

      - name: Atlas freshness (this repo's own Atlas)
        run: node scripts/atlas-check.mjs check --atlas "code-ops-docs/98 System/Atlas" --gate

      - name: Performance measurement regression eval
        run: node evals/benchmark-command/run.mjs

  # One Windows status that fails unless every Windows shard reports success.
  structural-lint-windows:
    if: always()
    needs: [structural-lint-windows-shard-1, structural-lint-windows-shard-2, structural-lint-windows-shard-3, structural-lint-windows-shard-4]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const ids = Object.keys(needs);
