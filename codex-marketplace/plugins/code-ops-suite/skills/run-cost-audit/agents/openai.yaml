interface:
  display_name: "Run Cost Audit"
  short_description: "Use when you want to audit a completed orchestrated run's cost discipline — dispatch counts, artifact sizes, tier/effort mix — against the suite's own bounded-wave and routing doctrine. Consumes a finished run's artifact folder, not a live one."
  default_prompt: "Use code-ops-suite:run-cost-audit for this task."
policy:
  allow_implicit_invocation: false
