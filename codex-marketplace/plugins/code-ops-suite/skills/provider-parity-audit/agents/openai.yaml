interface:
  display_name: "Provider Parity Audit"
  short_description: "Use when you want to audit the marketplace's own prose for provider-specific assumptions (harness mechanics, tool names, hook semantics) that would mislead a reader on a different host. The mechanical render layer is already covered by build-codex-marketplace.mjs --check; this skill covers prose only."
  default_prompt: "Use code-ops-suite:provider-parity-audit for this task."
policy:
  allow_implicit_invocation: false
