interface:
  display_name: "Provider Parity Audit"
  short_description: "Use when you want to audit the marketplace's own prose for provider-specific assumptions such as harness mechanics, tool names, and hook semantics that would mislead a reader on a different host. The mechanical render layer is already covered by build-codex-marketplace.mjs --check, so this skill covers prose only."
  default_prompt: "Use code-ops-suite:provider-parity-audit for this task."
policy:
  allow_implicit_invocation: true
