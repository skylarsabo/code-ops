interface:
  display_name: "Atlas"
  short_description: "Use when a repo's atlas needs to be created, refreshed after the code moved, or consolidated from inbox observations. The atlas is the repo's durable cache of judgment about the codebase. Freshness is decided mechanically by atlas-check.mjs. See code-ops-docs/40 Engineering/Techniques/atlas.md."
  default_prompt: "Use code-ops-suite:atlas for this task."
policy:
  allow_implicit_invocation: true
