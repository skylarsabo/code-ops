interface:
  display_name: "Ecosystem Watch"
  short_description: "Use when you want to know what changed in OUR stack that we should act on: dependency updates, CVEs, deprecations, and newly available capabilities, grounded in what we actually use. Schedulable, discovery only, and writes no code."
  default_prompt: "Use researcher:ecosystem-watch for this task."
policy:
  allow_implicit_invocation: true
